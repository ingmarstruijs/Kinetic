name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Bootstrap monorepo
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Analyze
        # Pre-existing infos/warnings should not block PRs; tests are the hard gate.
        run: dart run melos exec -- flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: dart run melos exec --dir-exists=test -- flutter test
