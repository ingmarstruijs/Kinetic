Name: Kinetic Link
AutoName: Kinetic Link

RepoType: git
Repo: https://github.com/ingmarstruijs/Kinetic.git

Builds:
  - versionName: 0.4.5
    versionCode: 1151
    commit: d26b4da47b20c56ec1df0466cfd129988ead694f
    subdir: apps/link
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - cd ../..
      - flutterVersion=$(tr -d '\r\n' < .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter --version
      - flutter pub get
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --split-per-abi --target-platform=android-arm
        --build-name=$$VERSION$$ --build-number=151

