Name: Kinetic Link
AutoName: Kinetic Link

RepoType: git
Repo: https://github.com/ingmarstruijs/Kinetic.git

Builds:
  - versionName: 0.4.2
    versionCode: 121
    commit: REPLACE_WITH_V0_4_2_FULL_SHA
    subdir: apps/link
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - cd ../..
      - flutterVersion=$(tr -d '\r\n' < .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter --version
      - dart pub global activate melos
      - dart pub global run melos bootstrap
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --split-per-abi --target-platform=android-arm --build-name=$$VERSION$$ --build-number=$$VERCODE$$

