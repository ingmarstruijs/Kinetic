name: kinetic_workspace
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

workspace:
  - apps/kids
  - apps/link
  - packages/kinetic_qr_scanner
  - packages/link_bridge
  - packages/webdav

dev_dependencies:
  melos: ^7.5.1

# Compile SQLite3MultipleCiphers from the vendored amalgamation so on-disk
# Drift DBs can be encrypted without downloading prebuilt libsqlite3mc.so
# (required for F-Droid). See third_party/sqlite3mc/ and
# https://drift.simonbinder.eu/platforms/encryption/
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite3mc/sqlite3mc_amalgamation.c
